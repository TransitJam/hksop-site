<!DOCTYPE html>
<html lang="en">
<head>
    <!-- This line right here fixes the scrambled emoji symbols! -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Parking Reporter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
            background-color: #f7fafc;
            color: #2d3748;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            color: #4a5568;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        button {
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            background-color: #e53e3e;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        button:hover {
            background-color: #c53030;
        }
        #status {
            margin-top: 20px;
            font-style: italic;
            color: #718096;
        }
    </style>
</head>
<body>

    <h1>🚨 Instant Illegal Parking Reporter</h1>
    <p>Tap the button below to fetch your current location and prepare a report email.</p>

    <!-- The Trigger Button -->
    <button id="reportBtn" onclick="generateReport()">
        📍 Generate Report Email
    </button>

    <!-- Status message area -->
    <p id="status"></p>

    <script>
   navigator.geolocation.getCurrentPosition(
    function(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        statusText.innerText = "Location acquired! Opening email...";

        // Grab the current date and time from the user's device clock
        const currentDateTime = new Date().toLocaleString(); 

        // 🛑 Make sure this is still set to your personal email address for testing!
        const emailTo = "james.ockenden@gmail.com"; 
        
        // NEW: Dynamically inserting the date/time into the subject line
        const subjectText = `Dangerous parking at ${currentDateTime}`;
        const subject = encodeURIComponent(subjectText);
        
        // NEW: Your custom message body structure
        const bodyText = `Dear Transport Complaints Department,

I would like to report an incident of dangerous illegal parking.

📅 Date & Time: ${currentDateTime}
📍 Google Maps Location: https://google.com{lat},${lon}

[Please type any additional vehicle details, like license plate or color, right here before sending]`;

        const emailBody = encodeURIComponent(bodyText);

        window.location.href = `mailto:${emailTo}?subject=${subject}&body=${emailBody}`;
    }, 
    function() {
        statusText.innerText = "Unable to retrieve your location. Please check your privacy permissions.";
    }
);

    </script>

</body>
</html>
