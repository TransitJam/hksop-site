    <title>Illegal Parking Report Tool</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;

        nav {

        }
        nav a, nav strong {
            margin: 0 10px;
            text-decoration: none;
            color: #2b6cb0;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            color: #4a5568;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;

        select {
            width: 100%;

            border: 2px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;

        }
        select:focus {
            border-color: #e53e3e;
            outline: none;
        }
        button {
            width: 100%;
            padding: 16px 32px;
            font-size: 18px;

            background-color: #e53e3e;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #c53030;
        }
        #status {
            margin-top: 20px;
            font-style: italic;
            color: #718096;
        }
    </style>
</head>
<body>

    <!-- Navigation Menu Bar -->
    <nav>
        <strong>🚨 Report Tool</strong> | 
        <a href="about.html">About Us</a>
    </nav>

    <h1>🚨 Illegal Parking Report Tool</h1>
    
     <!-- Explanation container card - Streamlined & citizen-focused -->
    <div style="background-color: #ebf8ff; border-left: 4px solid #3182ce; padding: 15px; margin: 20px auto 30px auto; text-align: left; border-radius: 0 6px 6px 0;">
        <p style="margin: 0; font-size: 15px; color: #2b6cb0; line-height: 1.6;">
            This tool captures your device's current <strong>location, time, and date</strong> and formats an automated email report ready to send to the <strong>Transport Complaints Unit</strong>. This is a static page with no tracking or data storage.
        </p>
    </div>


    <!-- The Violation Selection Dropdown Menu -->
    <div class="input-group">
        <label for="violationType">Type of Violation:</label>
        <select id="violationType">
            <option value="Double Parking">Double Parking</option>
            <option value="Pavement Obstruction">Pavement Obstruction</option>
            <option value="Pedestrian Crossing Obstruction">Pedestrian Crossing Obstruction</option>
            <option value="Restricted Zone Parking">Restricted Zone Parking</option>
            <option value="Unpaid Meter / Expired Meter">Unpaid Meter</option>
            <option value="Other Illegal Parking / Obstruction">Other</option>
        </select>
    </div>

    <!-- The Trigger Button -->
    <button id="reportBtn" onclick="generateReport()">
        📍 Generate Report Email
    </button>

    <!-- Status message area -->
    <p id="status"></p>

    <script>
    function generateReport() {
    const statusText = document.getElementById("status");
    statusText.innerText = "Fetching your location...";

    if (!navigator.geolocation) {
        statusText.innerText = "Geolocation is not supported by your browser.";
        return;
    }

    navigator.geolocation.getCurrentPosition(
        function(position) {
            try {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                statusText.innerText = "Location acquired! Opening email...";

                const currentDateTime = new Date().toLocaleString(); 
                const selectedViolation = document.getElementById("violationType").value;

                // 🛑 Keep your testing email address here while evaluating!
                const emailTo = "james.ockenden@gmail.com"; 
                
                const subjectText = "Dangerous parking at " + currentDateTime;
                const subject = encodeURIComponent(subjectText);
                
                let bodyText = "Dear Transport Complaints Department,\n\n";
                bodyText += "I would like to report an incident of dangerous illegal parking.\n\n";
                bodyText += "⚠️ Violation Category: " + selectedViolation + "\n";
                bodyText += "📅 Date & Time: " + currentDateTime + "\n\n";
                bodyText += "🌐 Raw Latitude: " + lat + "\n";
                bodyText += "🌐 Raw Longitude: " + lon;

                const emailBody = encodeURIComponent(bodyText);

                // This launches the mail application
                window.location.href = "mailto:" + emailTo + "?subject=" + subject + "&body=" + emailBody;

                // NEW: A 3-second timer subroutine that runs in the background.
                // It resets the text right after the mail client opens, so when they bounce back, the screen is clean!
                setTimeout(function() {
                    statusText.innerText = ""; // Wipes the text completely blank
                }, 3000); // 3000 milliseconds = 3 seconds
            } 
            catch (error) {
                statusText.innerText = "Error building email layout: " + error.message;
            }
        }, 
        function(error) {
            statusText.innerText = "Unable to retrieve your location. Error code: " + error.code;
        }
    );
}

    </script>

</body>
